name: Combined IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Playlists
        run: |
          curl -L https://raw.githubusercontent.com/Harleythetech/IPHTV/refs/heads/main/ph.m3u -o harley.m3u
          curl -L https://iptv-org.github.io/iptv/countries/ph.m3u -o iptvorg.m3u

      - name: Merge Playlists
        run: |
          python3 << 'EOF'
          import re

          files = ["harley.m3u", "iptvorg.m3u"]

          def score(extinf, url):
              s = 0

              if url.lower().startswith("https://"):
                  s += 200

              text = extinf.lower()

              if "1080" in text:
                  s += 100
              elif "720" in text:
                  s += 60
              elif "480" in text:
                  s += 40

              if "hevc" in text:
                  s += 20

              return s

          # -------------------------
          # Load blocked channels
          # -------------------------

          blocked = set()

          try:
              with open(
                  "blocked.txt",
                  encoding="utf8",
                  errors="ignore"
              ) as file:

                  for line in file:
                      line = line.strip().lower()

                      if line:
                          blocked.add(line)

          except FileNotFoundError:
              pass

          # -------------------------
          # Read source playlists
          # -------------------------

          channels = {}

          for filename in files:

              try:
                  with open(
                      filename,
                      encoding="utf8",
                      errors="ignore"
                  ) as file:

                      lines = file.readlines()

              except FileNotFoundError:
                  continue

              i = 0

              while i < len(lines):

                  if lines[i].startswith("#EXTINF"):

                      ext = lines[i].strip()

                      if i + 1 >= len(lines):
                          break

                      url = lines[i + 1].strip()

                      if not url.startswith("http"):
                          i += 2
                          continue

                      match = re.search(r",(.*)", ext)

                      name = (
                          match.group(1).strip()
                          if match
                          else url
                      )

                      lname = name.lower()

                      if lname in blocked:
                          i += 2
                          continue

                      channel = {
                          "name": name,
                          "ext": ext,
                          "url": url,
                          "score": score(ext, url)
                      }

                      # Keep the best source channel
                      if (
                          lname not in channels
                          or channel["score"]
                          > channels[lname]["score"]
                      ):
                          channels[lname] = channel

                      i += 2

                  else:
                      i += 1

          # -------------------------
          # Load custom.m3u
          # -------------------------

          try:
              with open(
                  "custom.m3u",
                  encoding="utf8",
                  errors="ignore"
              ) as file:

                  lines = file.readlines()

              i = 0

              while i < len(lines):

                  if lines[i].startswith("#EXTINF"):

                      ext = lines[i].strip()

                      if i + 1 >= len(lines):
                          break

                      url = lines[i + 1].strip()

                      if not url.startswith("http"):
                          i += 2
                          continue

                      match = re.search(r",(.*)", ext)

                      name = (
                          match.group(1).strip()
                          if match
                          else url
                      )

                      lname = name.lower()

                      if lname in blocked:
                          i += 2
                          continue

                      # Custom channel overrides
                      # Harley/iptv-org channel
                      channels[lname] = {
                          "name": name,
                          "ext": ext,
                          "url": url,
                          "score": 999999
                      }

                      i += 2

                  else:
                      i += 1

          except FileNotFoundError:
              pass

          # -------------------------
          # Create final playlist
          # -------------------------

          final = list(channels.values())

          final.sort(
              key=lambda x: x["name"].lower()
          )

          # -------------------------
          # Write combined.m3u
          # WITHOUT global EPG
          # -------------------------

          with open(
              "combined.m3u",
              "w",
              encoding="utf8"
          ) as out:

              out.write("#EXTM3U\n")

              for channel in final:

                  out.write(
                      channel["ext"].strip() + "\n"
                  )

                  out.write(
                      channel["url"].strip() + "\n"
                  )

          print("Generated combined.m3u")
          print("Channels:", len(final))

          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add combined.m3u custom.m3u blocked.txt

          git diff --cached --quiet && exit 0

          git commit -m "Automatic IPTV Update"

          git push
